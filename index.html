<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斗六國中 3D 校園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: full-screen 3D stage, with a directory + room finder panel on the right (bottom on phones) */
:root{
  --bg:#e8ecf0; --panel:#ffffff; --fg:#1b2430; --muted:#5b6878; --line:#d5dce3;
  --accent:#d9480f; --accent-soft:#fbe3d6;
  --c-special:#1f9a8c; --c-office:#e09a2a; --c-support:#8a6fc4; --c-public:#3a78c9; --c-class:#c9ccd0;
  --s-sky:#dfe6ec; --s-ground:#c9cfc6; --s-road:#7d858d; --s-plate:#d8d6d0; --s-pave:#cfcac2;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --panel:#182029; --fg:#e6ebf0; --muted:#94a1af; --line:#28323d;
  --accent:#ff7a45; --accent-soft:#3a2418; --c-class:#6d747c;
  --s-sky:#141b22; --s-ground:#3b423c; --s-road:#3a4047; --s-plate:#6b6963; --s-pave:#77726b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#182029; --fg:#e6ebf0; --muted:#94a1af; --line:#28323d;
  --accent:#ff7a45; --accent-soft:#3a2418; --c-class:#6d747c;
  --s-sky:#141b22; --s-ground:#3b423c; --s-road:#3a4047; --s-plate:#6b6963; --s-pave:#77726b;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:1fr 360px;grid-template-rows:100%}
.stage{position:relative;min-width:0;min-height:0}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;right:16px;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
.titleblock{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:10px 14px;pointer-events:auto}
.titleblock h1{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-wrap:balance}
.titleblock p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.compass{margin-left:auto;width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;pointer-events:auto;flex:none}
.compass .needle{width:52px;height:52px;display:grid;place-items:center}
.compass svg{width:40px;height:40px}
.tools{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;right:16px;display:flex;gap:6px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.sep{width:1px;background:var(--line);margin:4px 2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0;padding-block:18px 24px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:500}
.places{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.place{text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.place small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.place:hover{border-color:var(--muted)}
.place.on{border-color:var(--accent);background:var(--accent-soft)}

.finder input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:14px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px}
.cat i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cat small{color:var(--muted);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.results{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:260px;overflow-y:auto}
.res{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:14px}
.res:hover{background:var(--bg)}
.res i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.res span{flex:1;min-width:0}
.res small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}

.detail h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px;letter-spacing:.05em}
.detail .meta{font-size:13px;color:var(--muted);margin:0 0 12px}
.detail .desc{font-size:14px;line-height:1.7;margin:0 0 14px;max-width:60ch}
.floors{display:flex;flex-direction:column;gap:6px}
.floor{display:grid;grid-template-columns:40px 1fr;gap:10px;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;align-items:start}
.floor b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--accent);padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{font-size:12px;line-height:1.5;border-radius:4px;padding:1px 6px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c)}
.floor:hover{border-color:var(--muted)}
.floor.on{border-color:var(--accent);background:var(--accent-soft)}
.floor.nob{cursor:default}
.cutbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 8px}
.note{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;margin:0}
.empty{font-size:14px;color:var(--muted);line-height:1.7;margin:0}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:56% 44%}
  .panel{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .titleblock h1{font-size:17px}
  .titleblock p{display:none}
  .compass{width:44px;height:44px}.compass .needle{width:44px;height:44px}.compass svg{width:34px;height:34px}
  .btn{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>


<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="斗六國中 3D 校園模型"></canvas>
    <div class="hud">
      <div class="titleblock">
        <h1>斗六國中 3D 校園</h1>
        <p>拖曳旋轉 · 滾輪或雙指縮放 · 拉近可看到教室名稱</p>
      </div>
      <div class="compass" title="北方">
        <div class="needle" id="needle">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M20 5 L25 21 L20 18 L15 21 Z" fill="var(--accent)"/>
            <path d="M20 35 L25 21 L20 24 L15 21 Z" fill="var(--muted)"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="tools">
      <button class="btn" id="bOverview" type="button">全景</button>
      <button class="btn" id="bTop" type="button">俯視</button>
      <button class="btn" id="bGate" type="button">從校門看</button>
      <button class="btn" id="bCourt" type="button">從中庭看</button>
      <span class="sep"></span>
      <button class="btn" id="bColor" type="button" aria-pressed="true">用途著色</button>
      <button class="btn" id="bRooms" type="button" aria-pressed="true">教室名稱</button>
      <button class="btn" id="bLabels" type="button" aria-pressed="true">建築名稱</button>
    </div>
  </div>

  <aside class="panel">
    <section class="finder">
      <p class="eyebrow">找教室</p>
      <input id="q" type="search" placeholder="輸入教室或處室，例如 音樂、校長室、305" autocomplete="off">
      <div class="cats" id="cats"></div>
      <div class="results" id="results"></div>
      <p class="hint" id="hint">點分類可列出該類空間，點結果會飛到該層並剖開樓層。</p>
    </section>
    <section>
      <p class="eyebrow">建築與場地</p>
      <div class="places" id="places"></div>
    </section>
    <section class="detail" id="detail">
      <p class="empty">點選模型中的建築或教室，即可看到各樓層的空間配置；點樓層可把上方樓層移開，看到整層平面。</p>
    </section>
    <p class="note">依 2025 校園平面圖、樓層配置圖與空拍照片建模。建築外形與尺寸為估計值，每層約 3.6 公尺；各樓層內教室依配置圖順序排列，實際隔間大小以現場為準。</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
// ---------- coordinates: site units traced from the top-down aerial photo (u: west→east, v: north→south) ----------
const S=0.28, OX=462, OY=312;
const tx=u=>(u-OX)*S, tz=v=>(v-OY)*S;
const C={wallWhite:'#eceeec',wallGrey:'#b9bcbf',wallPink:'#e8c7c3',slab:'#f7f7f5',roofRed:'#b4473c',solar:'#27375a',
  dome:'#8f969e',barrel:'#d9d3b0',greenRoof:'#7fa36f',pink:'#e597b8',cream:'#e9e3d3'};

// ---------- room categories ----------
const CATS=[
  {id:'special',name:'專科教室',re:/音樂|美術|閱讀教室|電腦|生物|化學|雙語|家政|烹飪|童軍|陶藝|電工|木工|綜合工|舞蹈|科技體驗|自造|AI|視聽|管樂|知動/},
  {id:'office',name:'行政與辦公室',re:/校長|教務|學務|總務|人事|會計|會議|辦公室|印刷|傳達|廚房|器材/},
  {id:'support',name:'輔導・資優・特教',re:/輔導|特教|資優|學習|健康|員生社/},
  {id:'public',name:'禮堂・圖書・校史',re:/禮堂|圖書|校史|閱覽/},
  {id:'class',name:'班級教室',re:/^\d+$/},
];
function classify(n){if(/^\d+$/.test(n))return'class';for(const id of['public','support','special','office']){if(CATS.find(c=>c.id===id).re.test(n))return id}return'office'}

// rooms: per floor index → [{p: part index, rows: [[cells along the long axis], …rows across the short axis]}]
const BUILDINGS=[
 {id:'yuying',name:'育英樓',floors:4,wall:C.wallGrey,roof:'flat',solar:true,dome:[665,104,6.5],parts:[[560,8,770,124]],kind:'專科教室大樓',
  desc:'中庭北側、正面有圓頂的大樓，音樂、美術、自然實驗、電腦、家政等專科教室都在這裡，地下室為工藝教室。',
  rooms:{3:[{p:0,rows:[['音樂二','音樂一'],['美術二','美術一']]}],2:[{p:0,rows:[['圖書室'],['閱讀教室','學習 2','學習 1','電腦(二)']]}],
         1:[{p:0,rows:[['生物','化學'],['雙語中心','電腦(一)']]}],0:[{p:0,rows:[['家政','烹飪'],['印刷室','童軍','學習 345']]}]},
  basement:['陶藝','電工','綜合工','木工']},
 {id:'xiangying',name:'翔英樓',floors:4,wall:C.wallGrey,kind:'班級教室與行政處室',
  parts:[{r:[418,22,486,258],roof:'gable'},{r:[425,258,560,440],roof:'flat',solar:true}],drum:[492,440,15],
  desc:'中庭西側的大樓。北段紅色斜屋頂為班級教室；南段灰色大樓弧形正面朝向前庭，集中校長室與各處室。',
  rooms:{3:[{p:0,rows:[['319','219','119','118','117','116']]},{p:1,rows:[['4F 辦公室']]}],
         2:[{p:0,rows:[['316','315','314','313','312','311']]},{p:1,rows:[['3F 辦公室',['會議室',2]],['115','114','113']]}],
         1:[{p:0,rows:[['305','306','307','308','309','310']]},{p:1,rows:[['2F 辦公室','校長室','總務處']]}],
         0:[{p:0,rows:[['304','303','302','301','318','317']]},{p:1,rows:[['教務處','人事室','會計室','學務處']]}]}},
 {id:'rixin',name:'日新樓',floors:4,wall:C.wallWhite,roof:'flat',solar:true,kind:'班級教室與學生支援',
  parts:[[778,30,858,400],[760,400,880,522]],pinkTower:[760,360,778,400],
  desc:'中庭東側、沿民生路的白色長條大樓。一樓有員生社、家政教室與資優、學習、特教空間；南段二樓為輔導室。',
  rooms:{3:[{p:0,rows:[['218','217','216','215','4F 辦公室']]},{p:1,rows:[['214','213']]}],
         2:[{p:0,rows:[['207','208','209','210','3F 辦公室']]},{p:1,rows:[['211','212']]}],
         1:[{p:0,rows:[['資優二','206','205','204','203','2F 辦公室']]},{p:1,rows:[['輔導一','輔導二']]}],
         0:[{p:0,rows:[['員生社','家政教室','學習 8','資優一','學習 7','學習 6','321','特教辦公室']]},{p:1,rows:[['202','201']]}]}},
 {id:'qunying',name:'群英樓',floors:4,fh:4.2,wall:C.wallPink,roof:'hip',parts:[[30,366,325,550]],kind:'禮堂、科技中心與教室',
  desc:'校門西側的粉紅外牆大樓，紅色屋頂四角各有尖塔。頂樓為大禮堂，二樓有舞蹈教室與科技中心，一樓有健康中心與視聽教室。',
  rooms:{3:[{p:0,rows:[['大禮堂（含桌球室）']]}],
         2:[{p:0,rows:[['112','3F 辦公室','111','110','109'],['320','220','120','校史室']]}],
         1:[{p:0,rows:[[['舞蹈',2],'108','107','2F 辦公室'],['電腦一','科技辦公室','AI 智慧室','科技體驗','自造工藝']]}],
         0:[{p:0,rows:[['106','105','健康中心','104','103'],[['視聽教室',3],'102','101']]}]}},
 {id:'lequn',name:'樂群館',floors:1,fh:5,wall:C.cream,roof:'barrel',barrels:3,parts:[[18,10,215,96]],kind:'管樂與體育',
  desc:'西北角三連拱形屋頂的館舍，內有管樂教室與體育器材室，緊鄰文華街與 7 號球場。',
  rooms:{0:[{p:0,rows:[['管樂教室','體育器材室']]}]}},
 {id:'zhidong',name:'知動教室',floors:1,fh:4,wall:C.wallWhite,roof:'flat',parts:[[784,4,856,27]],kind:'專科教室',
  desc:'校園東北角、日新樓北端旁的知動教室，靠近後門與午餐廚房。',rooms:{0:[{p:0,rows:[['知動教室']]}]}},
 {id:'corner',name:'轉角閱覽室',floors:1,fh:5,wall:C.wallWhite,roof:'green',parts:[[708,402,760,466]],kind:'閱讀空間',
  desc:'大草坪東側、日新樓南段旁的低矮建物，屋頂為綠化平台。',rooms:{0:[{p:0,rows:[['轉角閱覽室']]}]}},
 {id:'kitchen',name:'午餐廚房',floors:1,fh:5,wall:C.wallWhite,roof:'flat',parts:[[868,6,924,84]],kind:'附屬建物',
  desc:'東北角，緊鄰民生路的午餐廚房。',rooms:{0:[{p:0,rows:[['午餐廚房']]}]}},
 {id:'guard',name:'傳達室',floors:1,fh:4,wall:C.wallWhite,roof:'tile',parts:[[440,572,484,618]],kind:'附屬建物',
  desc:'校門東側的傳達室，屋簷為紅瓦。',rooms:{0:[{p:0,rows:[['傳達室']]}]}},
 {id:'moto',name:'機車棚',floors:1,fh:2.6,wall:null,roof:'barrel',barrels:2,barrelColor:C.roofRed,parts:[[876,476,916,616]],kind:'附屬建物',
  desc:'東南角沿圍牆的紅色拱頂車棚。',plan:{'1F':'機車停放'}},
];
const AREAS=[
 {id:'courtyard',name:'中庭',type:'paint',r:[576,136,746,382],desc:'育英樓、翔英樓、日新樓圍出的中庭，地面為大面積彩繪球場。'},
 {id:'lawn',name:'大草坪',type:'grass',r:[580,394,746,506],desc:'彩繪中庭南側的草坪，南緣有一排黃色花樹。'},
 {id:'front',name:'前庭',type:'pave',r:[326,442,576,600],desc:'校門進來的前庭廣場與停車區，西側為群英樓，北側為翔英樓弧形正面。'},
 {id:'courts',name:'綜合球場',type:'court',r:[40,20,386,362],desc:'群英樓北側的綜合球場 1–7：北側 7 號靠樂群館，中間兩大片綠色球場為 3–6 號，1、2 號緊鄰群英樓。'},
 {id:'garden',name:'前庭花園',type:'grass',r:[486,516,918,616],desc:'沿南側道路的庭園綠帶，有水池與造景樹。'},
];

// ---------- theme ----------
const root=document.documentElement;
const tok=k=>getComputedStyle(root).getPropertyValue(k).trim()||'#888';

// ---------- three setup ----------
const canvas=document.getElementById('c'), stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,1,5000);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.maxPolarAngle=Math.PI/2.08; controls.minDistance=15; controls.maxDistance=900;
controls.screenSpacePanning=false;

scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f86,.72));
const sun=new THREE.DirectionalLight(0xfff6ea,.8);
sun.position.set(-120,200,160); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-170,right:170,top:150,bottom:-150,near:10,far:700});
sun.shadow.bias=-0.0006;
scene.add(sun);

const std=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0});
const M={ground:std('#888',1),road:std('#777',1),plate:std('#ccc',1),pave:std('#ccc',1),
  grass:std('#86ab6c'),court:std('#3f8f5c'),bball:std('#b5534a'),track:std('#a54a3e'),field:std('#93a56c'),
  water:std('#5d8fa8',.3),rail:std('#6b5e52',1),orchard:std('#5f8a4d',1),
  slab:std(C.slab),roofRed:std(C.roofRed,.7),solar:std(C.solar,.35),dome:std(C.dome,.6),greenRoof:std(C.greenRoof),pink:std(C.pink),
  gate:std('#d7d2cb'),wall:std('#d9c6bf'),trunk:std('#6e5b48',1)};

function applyTheme(){
  const sky=new THREE.Color(tok('--s-sky'));scene.background=sky;scene.fog=new THREE.Fog(sky,500,1500);
  M.ground.color.set(tok('--s-ground'));M.road.color.set(tok('--s-road'));M.plate.color.set(tok('--s-plate'));M.pave.color.set(tok('--s-pave'));
  BUILDINGS.forEach(b=>CATS.forEach(c=>{if(c.id!=='class')b.catMats[c.id].color.set(tok('--c-'+c.id))}));
  paint();labels.forEach(drawLabel)}
function paint(){
  const ac=new THREE.Color(tok('--accent')),none=new THREE.Color(0);
  BUILDINGS.forEach(b=>{const on=selected===b;
    const mats=[b.wallMat,...Object.values(b.catMats)];
    mats.forEach(m=>{m.emissive.copy(on&&selFloor===null?ac:none);m.emissiveIntensity=on&&selFloor===null?.35:0});
    b.cells.forEach(c=>{c.mesh.material=colorOn?b.catMats[c.type]:b.wallMat;
      const hot=c===focusCell;if(c.label.userData.opt.hot!==hot){c.label.userData.opt.hot=hot;drawLabel(c.label)}});
    if(b.label.userData.opt.hot!==on){b.label.userData.opt.hot=on;drawLabel(b.label)}});
  AREAS.forEach(a=>{const on=selected===a;if(a.label.userData.opt.hot!==on){a.label.userData.opt.hot=on;drawLabel(a.label)}})}
function applyCut(){BUILDINGS.forEach(b=>{const cut=selected===b&&selFloor!==null;
  b.floorMeshes.forEach((arr,f)=>arr.forEach(m=>m.visible=!cut||f<=selFloor));
  b.slabs.forEach((arr,f)=>arr.forEach(m=>m.visible=!cut||f<=selFloor));
  b.extras.forEach(m=>m.visible=!cut);
  b.cells.forEach(c=>{c.label.position.y=(cut&&c.f===selFloor)?c.f*b.fhv+b.fhv+1.3:c.f*b.fhv+b.fhv*.55});
  b.label.position.y=cut?(selFloor+1)*b.fhv+7:b.top+4})}
const tmp=new THREE.Vector3();
function updateLabels(){const cp=camera.position;
  BUILDINGS.forEach(b=>{b.label.visible=showLabels;const cut=selected===b&&selFloor!==null;
    b.cells.forEach(c=>{let v=false;
      if(showRooms){if(cut)v=c.f===selFloor;
        else if(c===focusCell)v=true;
        else if(c.type!=='class'||selected===b){v=cp.distanceTo(c.label.position)<(selected===b?200:120)}}
      c.label.visible=v})});
  AREAS.forEach(a=>a.label.visible=showLabels);
  labels.forEach(l=>{if(l.userData.opt.plain&&!minor.includes(l))l.visible=showLabels});
  minor.forEach(l=>l.visible=showLabels&&cp.distanceTo(l.position)<220)}
new MutationObserver(applyTheme).observe(root,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

// ---------- panel: places ----------
const placesEl=document.getElementById('places'),detail=document.getElementById('detail');
const ALL=[...BUILDINGS,...AREAS];const EMPTY=detail.innerHTML;
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
ALL.forEach(x=>{const btn=document.createElement('button');btn.type='button';btn.className='place';btn.id='p-'+x.id;
  btn.innerHTML=`<span>${x.name}</span><small>${x.floors?(x.floors>1?x.floors+'F':''):'場地'}</small>`;
  btn.onclick=()=>select(x,true);placesEl.appendChild(btn);x.btn=btn});
const fl=f=>(f+1)+'F';
function select(x,fly,floor=null){
  selected=x;selFloor=floor;if(!x||!x.cells||!x.cells.includes(focusCell))focusCell=null;
  ALL.forEach(y=>y.btn.classList.toggle('on',y===x));renderDetail();applyCut();paint();if(fly&&x)flyTo(x)}
function renderDetail(){const x=selected;
  if(!x){detail.innerHTML=EMPTY;return}
  let h=`<h2>${x.name}</h2><p class="meta">${x.floors?`${x.kind} · 地上 ${x.floors} 層${x.basement?'、地下 1 層':''}`:'戶外場地'}</p><p class="desc">${x.desc}</p>`;
  if(x.cells&&x.cells.length){
    h+=`<div class="cutbar"><span class="eyebrow" style="margin:0">樓層配置${x.floors>1?' · 點樓層剖開':''}</span>${selFloor!==null?'<button type="button" class="btn" id="uncut">顯示全部樓層</button>':''}</div><div class="floors">`;
    for(let f=x.floors-1;f>=0;f--){const cs=x.cells.filter(c=>c.f===f);if(!cs.length)continue;
      h+=`<button type="button" class="floor${x.floors<2?' nob':''}${selFloor===f?' on':''}" data-f="${f}"><b>${fl(f)}</b><span class="chips">${cs.map(c=>`<span class="chip" style="--c:var(--c-${c.type})">${esc(c.name)}</span>`).join('')}</span></button>`}
    if(x.basement)h+=`<div class="floor nob"><b>B1</b><span class="chips">${x.basement.map(n=>`<span class="chip" style="--c:var(--c-special)">${n}</span>`).join('')}</span></div>`;
    h+='</div>'}
  else if(x.plan){h+=`<div class="floors">${Object.entries(x.plan).map(([k,v])=>`<div class="floor nob"><b>${k}</b><span>${v}</span></div>`).join('')}</div>`}
  detail.innerHTML=h;
  detail.querySelectorAll('button.floor').forEach(el=>el.onclick=()=>{if(x.floors<2)return;const f=+el.dataset.f;focusCell=null;selFloor=selFloor===f?null:f;renderDetail();applyCut();paint()});
  const u=document.getElementById('uncut');if(u)u.onclick=()=>{selFloor=null;focusCell=null;renderDetail();applyCut();paint()}}
function flyTo(x){const c=x.center.clone();const off=camera.position.clone().sub(controls.target);const dist=x.floors>1?120:85;off.setLength(dist);
  if(off.y<dist*.45)off.y=dist*.55;tween(c,c.clone().add(off))}
function goCell(c){focusCell=c;select(c.b,false,c.b.floors>1?c.f:null);focusCell=c;paint();
  const t=c.pos.clone();t.y=c.f*c.b.fhv+2;const off=camera.position.clone().sub(controls.target);off.y=0;if(off.lengthSq()<1)off.set(0,0,1);off.setLength(38);off.y=42;tween(t,t.clone().add(off))}
let anim=null;
function tween(target,pos,ms=850){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  anim={t0:performance.now(),a:controls.target.clone(),p:camera.position.clone(),target,pos,ms:reduce?1:ms}}

// ---------- panel: finder ----------
const q=document.getElementById('q'),results=document.getElementById('results'),catsEl=document.getElementById('cats'),hint=document.getElementById('hint');
let catFilter=null;
const roomList=CELLS.filter(c=>!/^(午餐廚房|傳達室)$/.test(c.name));
CATS.forEach(c=>{const n=roomList.filter(r=>r.type===c.id).length+(c.id==='special'?BUILDINGS[0].basement.length:0);
  const b=document.createElement('button');b.type='button';b.className='cat';b.style.setProperty('--c',`var(--c-${c.id})`);b.setAttribute('aria-pressed','false');
  b.innerHTML=`<i></i>${c.name}<small>${n}</small>`;b.onclick=()=>{catFilter=catFilter===c.id?null:c.id;q.value='';renderResults()};c.btn=b;catsEl.appendChild(b)});
function renderResults(){const s=q.value.trim();CATS.forEach(c=>c.btn.setAttribute('aria-pressed',String(catFilter===c.id)));
  let list=[];
  if(s){list=roomList.filter(c=>c.name.includes(s)||(c.b.name+fl(c.f)).includes(s)||c.name.replace(/\s/g,'').includes(s.replace(/\s/g,'')))}
  else if(catFilter){list=roomList.filter(c=>c.type===catFilter)}
  results.innerHTML='';hint.hidden=!!(s||catFilter);
  if((s||catFilter)&&!list.length){results.innerHTML=`<p class="hint">找不到「${esc(s)}」，試試教室名稱的一部分，例如「音樂」或「辦公室」。</p>`}
  list.slice(0,80).forEach(c=>{const b=document.createElement('button');b.type='button';b.className='res';b.style.setProperty('--c',`var(--c-${c.type})`);
    b.innerHTML=`<i></i><span>${esc(c.name)}</span><small>${c.b.name} ${fl(c.f)}</small>`;b.onclick=()=>goCell(c);results.appendChild(b)});
  if(catFilter==='special'&&!s){BUILDINGS[0].basement.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='res';b.style.setProperty('--c','var(--c-special)');
    b.innerHTML=`<i></i><span>${n}</span><small>育英樓 B1</small>`;b.onclick=()=>select(BUILDINGS[0],true,0);results.appendChild(b)})}}
q.addEventListener('input',()=>{catFilter=null;renderResults()});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=results.querySelector('.res');if(f)f.click()}});

// ---------- tools ----------
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const views={overview:[V(0,0,5),V(-40,190,250)],top:[V(0,0,0),V(0,360,1)],
  gate:[V(tx(520),4,tz(380)),V(tx(410),22,tz(720))],court:[V(tx(665),8,tz(60)),V(tx(660),14,tz(470))]};
document.getElementById('bOverview').onclick=()=>tween(...views.overview);
document.getElementById('bTop').onclick=()=>tween(...views.top);
document.getElementById('bGate').onclick=()=>tween(...views.gate);
document.getElementById('bCourt').onclick=()=>tween(...views.court);
function toggle(id,fn){const el=document.getElementById(id);el.onclick=()=>{const v=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',String(v));fn(v)}}
toggle('bLabels',v=>showLabels=v);toggle('bRooms',v=>showRooms=v);toggle('bColor',v=>{colorOn=v;paint()});

// picking
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
function pickHit(e){const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
  return ray.intersectObjects(pickables,false).find(h=>h.object.visible)||null}
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>=6)return;
  const h=pickHit(e);if(!h){select(null,false);return}const u=h.object.userData;
  if(u.cell&&(selected===u.cell.b)){focusCell=u.cell;if(selFloor===null&&u.cell.b.floors>1)selFloor=u.cell.f;renderDetail();applyCut();paint();return}
  focusCell=null;select(ALL.find(x=>x.id===(u.bid||u.aid))||null,false)});
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)return;canvas.style.cursor=pickHit(e)?'pointer':'grab'});

// resize + loop
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);
const needle=document.getElementById('needle');
camera.position.copy(views.overview[1]);controls.target.copy(views.overview[0]);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function loop(now){requestAnimationFrame(loop);
  if(anim){const t=Math.min(1,(now-anim.t0)/anim.ms),k=ease(t);controls.target.lerpVectors(anim.a,anim.target,k);camera.position.lerpVectors(anim.p,anim.pos,k);if(t>=1)anim=null}
  controls.update();updateLabels();needle.style.transform=`rotate(${controls.getAzimuthalAngle()}rad)`;renderer.render(scene,camera)}
resize();applyCut();applyTheme();
if(document.fonts)document.fonts.ready.then(()=>labels.forEach(drawLabel));
requestAnimationFrame(loop);
})();
</script>
